name: 나라장터 엔진오일 입찰 모니터링

on:
  schedule:
    # 매시 05분, 35분(UTC). 한국시간 기준 30분 간격으로 실행된다.
    - cron: "5,35 * * * *"
  workflow_dispatch: {}  # 수동 실행 버튼

# state/seen.json 을 커밋해 중복 알림을 막으므로 쓰기 권한이 필요하다.
permissions:
  contents: write

# 동시에 두 번 돌지 않도록(상태 파일 충돌 방지).
concurrency:
  group: naramarket-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 모니터링 실행
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m nara_monitor.main

      # 상태 파일을 커밋/푸시한다.
      # 핵심: 오래된 실행을 Re-run 하거나 실행이 겹쳐 원격 main 이 앞서 있어도
      #       (1) 항상 최신 원격으로 맞추고 (2) 원격 기록과 이번 기록을 합집합으로
      #       병합해 손실 없이 (3) 경합 시 재시도하며 push 한다.
      - name: 상태 파일 커밋(변경 시)
        run: |
          if [[ -z "$(git status --porcelain state/seen.json)" ]]; then
            echo "상태 변경 없음 — 커밋 생략"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 이번 실행이 만든 seen.json 을 따로 보관(아래 reset 으로 덮어써지므로).
          cp state/seen.json /tmp/seen.local.json

          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard FETCH_HEAD        # 뒤처진 체크아웃/재실행 대비: 최신 원격 main 으로 이동

            # 최신 원격의 seen.json 과 이번 실행 기록을 합집합으로 병합(서로의 기록 보존).
            python scripts/merge_seen.py state/seen.json /tmp/seen.local.json state/seen.json

            if [[ -z "$(git status --porcelain state/seen.json)" ]]; then
              echo "원격에 이미 반영됨 — 커밋 불필요"
              exit 0
            fi

            git add state/seen.json
            git commit -m "chore: 알림 발송 공고 기록 업데이트 [skip ci]"

            if git push origin HEAD:main; then
              echo "push 성공"
              exit 0
            fi

            echo "push 경합 감지 — 재시도 ${i}/5"
            sleep $((RANDOM % 5 + 2))
          done

          echo "여러 번 재시도했지만 push 실패"
          exit 1
